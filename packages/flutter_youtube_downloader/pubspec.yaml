name: flutter_youtube_downloader
description: Vendored & modernized fork of flutter_youtube_downloader 0.0.5 — extracts direct YouTube media URLs on-device (NewPipe Extractor engine, Android).
version: 0.0.5+pips1
homepage: https://github.com/Destiny-Ed/flutter_youtube_downloader

environment:
  sdk: ">=2.12.0 <4.0.0"
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        package: com.destinyed.flutter_youtube_downloader
        pluginClass: FlutterYoutubeDownloaderPlugin
