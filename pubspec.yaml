name: pips
description: Pips Cloud — cloud storage, channels, chat and Pips DB (Flutter port).
publish_to: 'none'
version: 3.3.1+3

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  http_parser: ^4.0.2
  shared_preferences: ^2.2.2
  file_picker: ^10.1.2
  path_provider: ^2.1.2
  video_player: ^2.8.3
  url_launcher: ^6.2.5
  share_plus: ^10.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
