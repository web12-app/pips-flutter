name: Build & Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# A force-moved tag must not leave zombie builds racing — the newest run wins
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          # NOTE: pubspec.lock is intentionally NOT in the key — the version
          # bump on every release changes the lock file hash, which used to
          # invalidate the cache and force a ~1h cold rebuild of the heavy
          # native packages (ffmpeg-kit etc). Packages are now built ONCE on
          # the first tag and every next tag build reuses them (fast).
          key: gradle-v3-${{ runner.os }}-${{ hashFiles('android/**', '.github/workflows/release.yml') }}
          restore-keys: |
            gradle-v3-${{ runner.os }}-
            gradle-v2-${{ runner.os }}-
            gradle-${{ runner.os }}-

      - name: Cache pub packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-v1-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            pub-v1-${{ runner.os }}-

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Patch video_thumbnail (Gradle 9 compat)
        run: python3 tools/patch_video_thumbnail.py

      - name: Verify code
        run: flutter analyze --no-fatal-infos

      - name: Decode release keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/pips-release.keystore

      - name: Write key.properties
        run: |
          cat > android/key.properties <<EOF
          storeFile=pips-release.keystore
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF

      - name: Build signed release APK
        run: flutter build apk --release

      - name: Rename APK with tag
        run: cp build/app/outputs/flutter-apk/app-release.apk "pips-${{ github.ref_name }}.apk"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: pips-*.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
