name: Build & Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Patch video_thumbnail (Gradle 9 compat)
        run: python3 tools/patch_video_thumbnail.py

      - name: Verify code
        run: flutter analyze --no-fatal-infos

      - name: Decode release keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/pips-release.keystore

      - name: Write key.properties
        run: |
          cat > android/key.properties <<EOF
          storeFile=pips-release.keystore
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF

      - name: Build signed release APK
        run: flutter build apk --release

      - name: Rename APK with tag
        run: cp build/app/outputs/flutter-apk/app-release.apk "pips-${{ github.ref_name }}.apk"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: pips-*.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
