name: Build & Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# A force-moved tag must not leave zombie builds racing — the newest run wins
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          # NOTE: pubspec.lock is intentionally NOT in the key — the version
          # bump on every release changes the lock file hash, which used to
          # invalidate the cache and force a ~1h cold rebuild of the heavy
          # native packages (ffmpeg-kit etc). Packages are now built ONCE on
          # the first tag and every next tag build reuses them (fast).
          key: gradle-v3-${{ runner.os }}-${{ hashFiles('android/**', '.github/workflows/release.yml') }}
          restore-keys: |
            gradle-v3-${{ runner.os }}-
            gradle-v2-${{ runner.os }}-
            gradle-${{ runner.os }}-

      - name: Cache pub packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-v1-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            pub-v1-${{ runner.os }}-

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Patch video_thumbnail (Gradle 9 compat)
        run: python3 tools/patch_video_thumbnail.py

      - name: Verify code
        run: flutter analyze --no-fatal-infos

      - name: Decode release keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/pips-release.keystore

      - name: Write key.properties
        run: |
          cat > android/key.properties <<EOF
          storeFile=pips-release.keystore
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF

      - name: Build signed release APK
        run: flutter build apk --release

      - name: Rename APK with tag
        run: cp build/app/outputs/flutter-apk/app-release.apk "pips-${{ github.ref_name }}.apk"

      - name: Publish GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        timeout-minutes: 45
        run: |
          APK="pips-${TAG}.apk"
          ls -la "$APK"
          for attempt in 1 2 3; do
            echo "== Upload attempt $attempt =="
            RID=$(curl -sf -H "Authorization: token $GITHUB_TOKEN" "https://api.github.com/repos/$REPO/releases/tags/$TAG" | python3 -c "import json,sys; d=json.load(sys.stdin); print(d.get('id') or '')" || true)
            if [ -z "$RID" ]; then
              echo "creating release $TAG"
              RID=$(curl -sf -X POST -H "Authorization: token $GITHUB_TOKEN" -H "Content-Type: application/json" \
                "https://api.github.com/repos/$REPO/releases" \
                -d "{\"tag_name\":\"$TAG\",\"name\":\"$TAG\",\"generate_release_notes\":true}" \
                | python3 -c "import json,sys; d=json.load(sys.stdin); print(d.get('id') or '')" || true)
            fi
            if [ -z "$RID" ]; then echo "release id missing"; sleep 20; continue; fi
            echo "release id: $RID"
            # drop a stale asset with the same name (overwrite)
            for AID in $(curl -sf -H "Authorization: token $GITHUB_TOKEN" "https://api.github.com/repos/$REPO/releases/$RID/assets" \
              | python3 -c "
import json,sys
try:
    for a in json.load(sys.stdin):
        if a.get('name') == '$APK': print(a['id'])
except Exception: pass"); do
              echo "deleting stale asset $AID"
              curl -sf -X DELETE -H "Authorization: token $GITHUB_TOKEN" "https://api.github.com/repos/$REPO/releases/assets/$AID" || true
              sleep 2
            done
            UP=$(curl -s -o /tmp/up.json -w "%{http_code}" -X POST \
              -H "Authorization: token $GITHUB_TOKEN" -H "Content-Type: application/octet-stream" \
              --data-binary @"$APK" \
              "https://uploads.github.com/repos/$REPO/releases/$RID/assets?name=$APK")
            echo "upload http: $UP"
            if [ "$UP" = "201" ]; then
              python3 -c "import json; d=json.load(open('/tmp/up.json')); print('uploaded:', d.get('name'), d.get('size'), 'bytes')"
              exit 0
            fi
            sleep 30
          done
          echo "asset upload failed after retries"
          exit 1
