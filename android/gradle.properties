org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
# hosted runners have 7GB RAM: 8G heap + 4G metaspace made R8's peak OOM-kill the
# runner service ("shutdown signal" / exit 143 mid-assembleRelease). 4G+1G fits.
org.gradle.vfs.watch=false
# CI: file-watcher threw "Already watching path" mid-R8; watching buys nothing here
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
android.suppressUnsupportedCompileSdk=34,35
